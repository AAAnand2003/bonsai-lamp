<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f7f3e9"><title>Bonsai · A little corner of calm</title>
<style>
:root{font-family:Georgia,'Times New Roman',serif;color:#2f4838;background:#f7f3e9}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 34%,#fffdf4 0%,#f7f3e9 66%);padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}main{max-width:430px;margin:auto;padding:32px 0 40px}.eyebrow{text-align:center;font:600 10px/1.5 system-ui,sans-serif;letter-spacing:3px;color:#85917c}h1{text-align:center;font-weight:400;font-size:54px;letter-spacing:-2px;margin:7px 0 0}.sub{text-align:center;font-size:15px;color:#8b947f;margin:6px 0 0}.scene{position:relative;height:295px;display:grid;place-items:center;margin:15px 0 0}.halo{position:absolute;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,#ffe7aa99 0%,#f8e7b22b 45%,transparent 70%);opacity:.95;transition:opacity .3s}.off .halo{opacity:0}.scene svg{position:relative;width:100%;height:100%;filter:drop-shadow(0 16px 13px #475c3b20)}.caption{text-align:center;color:#84917d;font-size:14px;margin:-5px 0 26px}.panel{background:#ffffffbd;border:1px solid #fff;border-radius:24px;padding:22px;box-shadow:0 14px 45px #42513b0c}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.kicker{font:600 10px system-ui,sans-serif;letter-spacing:1.6px;color:#9b9f8e}.label{font-size:21px;margin-top:4px}.power{width:58px;height:58px;border:0;border-radius:18px;background:#3e6048;color:white;font-size:27px;cursor:pointer;box-shadow:0 7px 16px #3e60482c}.power.off{background:#aab0a3;box-shadow:none}.rule{height:1px;background:#e8e9df;margin:20px 0}.sliderhead{display:flex;justify-content:space-between;align-items:center;font-size:17px}.pct{font:600 15px system-ui,sans-serif;color:#526c52}input[type=range]{width:100%;accent-color:#4e7556;margin:22px 0 7px;cursor:pointer}.ends{display:flex;justify-content:space-between;color:#a3aa9a;font:11px system-ui,sans-serif}.connect{width:100%;border:0;border-radius:15px;padding:15px;background:#456b50;color:#fff;font:600 14px system-ui,sans-serif;cursor:pointer;margin-top:18px}.connect:disabled{opacity:.6}.status{text-align:center;font:12px/1.5 system-ui,sans-serif;color:#899385;margin:11px 0}.settings{margin-top:19px;font:12px system-ui,sans-serif;color:#667662}.settings summary{cursor:pointer;text-align:center}.settings label{display:block;margin:14px 0 6px}.settings input{width:100%;padding:12px;border:1px solid #d7ddcf;border-radius:10px;background:white;font:13px system-ui,sans-serif;color:#2f4838}.help{font:11px/1.5 system-ui,sans-serif;color:#8a9485;margin:8px 0}.footer{text-align:center;font:11px system-ui,sans-serif;color:#b0b4a7;margin-top:28px}
</style></head><body><main><div class="eyebrow">YOUR LITTLE CORNER OF CALM</div><h1>Bonsai</h1><p class="sub">A little light, a little peace.</p>
<div class="scene" id="scene"><div class="halo"></div><svg viewBox="0 0 390 300" aria-label="Illustration of a bonsai tree with warm lights" role="img"><defs><linearGradient id="trunk" x1="0" x2="1"><stop stop-color="#6a5138"/><stop offset=".55" stop-color="#987253"/><stop offset="1" stop-color="#4e402d"/></linearGradient><radialGradient id="leaf"><stop stop-color="#78956b"/><stop offset="1" stop-color="#3e6049"/></radialGradient><radialGradient id="light"><stop stop-color="#fff8ce"/><stop offset=".24" stop-color="#ffe9a1"/><stop offset=".65" stop-color="#e9b85a66"/><stop offset="1" stop-color="#e9b85a00"/></radialGradient></defs><ellipse cx="195" cy="266" rx="107" ry="15" fill="#a6ad9a" opacity=".18"/><path d="M129 249 Q146 237 169 241 Q200 228 228 242 Q255 240 271 252 L264 264 Q190 280 121 264Z" fill="#777c6c"/><path d="M132 250 Q196 234 263 250 Q241 261 133 260Z" fill="#a3a597"/><path d="M186 245 Q183 213 195 190 Q208 170 189 149 Q180 136 188 113" stroke="url(#trunk)" stroke-width="20" fill="none" stroke-linecap="round"/><path d="M193 202 Q153 192 133 162 M194 183 Q229 177 252 149 M190 154 Q161 143 151 121 M188 135 Q211 116 223 98" stroke="#76563d" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M134 162 Q117 152 98 152 M250 149 Q265 143 281 143 M152 121 Q140 109 127 103" stroke="#73533b" stroke-width="5" fill="none" stroke-linecap="round"/><g fill="url(#leaf)"><ellipse cx="124" cy="151" rx="61" ry="28"/><ellipse cx="107" cy="136" rx="44" ry="26"/><ellipse cx="160" cy="145" rx="40" ry="22"/><ellipse cx="261" cy="141" rx="63" ry="29"/><ellipse cx="285" cy="125" rx="39" ry="24"/><ellipse cx="223" cy="130" rx="35" ry="24"/><ellipse cx="150" cy="108" rx="53" ry="27"/><ellipse cx="175" cy="93" rx="43" ry="23"/><ellipse cx="210" cy="89" rx="54" ry="26"/><ellipse cx="233" cy="107" rx="42" ry="25"/></g><g fill="#99ad82" opacity=".52"><ellipse cx="116" cy="127" rx="28" ry="8"/><ellipse cx="164" cy="92" rx="28" ry="7"/><ellipse cx="218" cy="76" rx="28" ry="7"/><ellipse cx="275" cy="120" rx="26" ry="8"/></g><g id="lights"><circle cx="119" cy="147" r="20" fill="url(#light)"/><circle cx="157" cy="112" r="20" fill="url(#light)"/><circle cx="208" cy="88" r="22" fill="url(#light)"/><circle cx="247" cy="142" r="20" fill="url(#light)"/><circle cx="285" cy="132" r="20" fill="url(#light)"/><circle cx="179" cy="142" r="18" fill="url(#light)"/><g fill="#fff4c4"><circle cx="119" cy="147" r="3"/><circle cx="157" cy="112" r="3"/><circle cx="208" cy="88" r="3"/><circle cx="247" cy="142" r="3"/><circle cx="285" cy="132" r="3"/><circle cx="179" cy="142" r="3"/></g></g></svg></div>
<p class="caption">Let your space glow softly.</p><section class="panel"><div class="top"><div><div class="kicker">AMBIENCE</div><div class="label">Your bonsai light</div></div><button class="power" id="power" aria-label="Turn lamp on or off">⏻</button></div><div class="rule"></div><div class="sliderhead"><span>Brightness</span><span class="pct" id="pct">65%</span></div><input id="brightness" type="range" min="0" max="100" value="65" aria-label="Brightness"><div class="ends"><span>Soft glow</span><span>Full bloom</span></div></section><button class="connect" id="connect">Connect to bonsai · Bluetooth</button><p class="status" id="status" role="status">Not connected</p><p class="footer">Made with care ♡</p></main>
<script>
const $=id=>document.getElementById(id);let device,characteristic,isOn=true,brightness=65,lastSend=0,pending=null;
const status=t=>$('status').textContent=t;const BONSAI_SERVICE=0x180A;
function uuid(raw){let s=raw.trim().replace(/^0x/i,'');if(/^[0-9a-f]{4}$/i.test(s))return parseInt(s,16);if(/^[0-9a-f]{8}$/i.test(s))return s+'-0000-1000-8000-00805f9b34fb';if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s))return s;throw Error('Enter the service UUID from BLEService(...) in your Arduino sketch.');}
function update(){ $('pct').textContent=brightness+'%';$('power').classList.toggle('off',!isOn);$('scene').classList.toggle('off',!isOn);$('lights').style.opacity=isOn?String(.25+.75*brightness/100):'0';$('power').setAttribute('aria-pressed',String(isOn));}
async function send(){if(!characteristic)return;let v=Math.round((isOn?brightness:0)*255/100);try{let b=Uint8Array.of(v);if(characteristic.properties.writeWithoutResponse && characteristic.writeValueWithoutResponse)await characteristic.writeValueWithoutResponse(b);else if(characteristic.properties.write && characteristic.writeValueWithResponse)await characteristic.writeValueWithResponse(b);else await characteristic.writeValue(b);status('Connected · '+(isOn?brightness+'% brightness':'lamp off'));}catch(e){status('Could not send brightness: '+e.message)}}
function scheduleSend(){if(pending)clearTimeout(pending);let elapsed=Date.now()-lastSend;if(elapsed>110){lastSend=Date.now();send()}else pending=setTimeout(()=>{lastSend=Date.now();send();pending=null},110-elapsed)}
$('brightness').addEventListener('input',e=>{brightness=+e.target.value;update();if(isOn)scheduleSend()});$('brightness').addEventListener('change',()=>{if(isOn)send()});$('power').addEventListener('click',()=>{isOn=!isOn;update();send()});
$('connect').addEventListener('click',async()=>{if(!navigator.bluetooth){status('Web Bluetooth unavailable. Open this page in Bluefy over HTTPS.');return}const service=BONSAI_SERVICE;$('connect').disabled=true;status('Choose your Arduino in the Bluetooth list…');try{device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[service]});device.addEventListener('gattserverdisconnected',()=>{characteristic=null;status('Disconnected · tap Connect to reconnect');$('connect').textContent='Reconnect to bonsai'});status('Connecting to '+(device.name||'Arduino')+'…');const server=await device.gatt.connect();const primary=await server.getPrimaryService(service);characteristic=await primary.getCharacteristic(0x2a57);$('connect').textContent='Connected ✓';status('Connected to '+(device.name||'Arduino'));await send()}catch(e){status('Connection failed: '+e.message);$('connect').textContent='Connect to bonsai · Bluetooth'}finally{$('connect').disabled=false}});update();
</script></body></html>
